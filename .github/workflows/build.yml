name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # electron-builder auto-publishes to the GitHub Release matching the git
      # tag; it needs a token to upload the installers + latest*.yml metadata
      # (the latter is what the in-app auto-updater reads).
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - if: matrix.os == 'ubuntu-latest'
        run: npm run dist:linux
      - if: matrix.os == 'windows-latest'
        run: npm run dist:win
      - if: matrix.os == 'macos-latest'
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: darknode-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.dmg
