name: Build macOS app

# Builds the Sentinel desktop app for macOS (.dmg + .zip, Apple Silicon + Intel) on a
# real macOS runner — the one artifact that can't be cross-built from Linux. Runs on a
# published release (auto-attaches the .dmg) or on demand.
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Build macOS (.dmg + .zip, Intel + Apple Silicon)
        # Signing + notarization are OPTIONAL — the build works unsigned. To ship a
        # SIGNED + notarized .dmg, add these repo secrets (Settings → Secrets → Actions):
        #   MAC_CSC_LINK               base64 of your Apple Developer ID .p12
        #   MAC_CSC_KEY_PASSWORD       the .p12 password
        #   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID   (for notarization)
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # No cert → don't attempt code signing (skips the step that fails on an
          # unsigned build). When MAC_CSC_LINK is provided, that cert still signs.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK != '' }}
        run: npm run dist:mac

      - name: Upload build artifacts (always available from this run)
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

      - name: Publish the .dmg / .zip to the downloads release (sentinel-web)
        # The website serves downloads from the sentinel-web "sentinel" release, so
        # publish there. Needs a repo secret RELEASE_TOKEN = a PAT with repo access to
        # SpartanKing18/sentinel-web. Without it, the build is still on this run's artifacts.
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::No RELEASE_TOKEN secret set — .dmg is on this run's artifacts only. Add a PAT with repo access to sentinel-web to auto-publish it to the downloads page."
            exit 0
          fi
          gh release upload sentinel dist/*.dmg dist/*.zip --repo SpartanKing18/sentinel-web --clobber
