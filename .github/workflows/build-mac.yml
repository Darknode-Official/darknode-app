name: Build macOS app

# Builds the Darknode desktop app for macOS on native runners — Intel (macos-13) and
# Apple Silicon (macos-14) — so each arch is built natively (no cross-compile of the
# node-pty native module). Runs on a published release or on demand.
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, arch: x64 }    # Intel — cross-built on arm64 (macos-13 runners are scarce)
          - { os: macos-14, arch: arm64 }   # Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Build ${{ matrix.arch }} (.dmg + .zip)
        # Signing + notarization are OPTIONAL. With no cert we build UNSIGNED
        # (--config.mac.identity=null skips the ad-hoc signing that errors on CI).
        # Add these repo secrets to ship a SIGNED + notarized build:
        #   MAC_CSC_LINK  MAC_CSC_KEY_PASSWORD  APPLE_ID  APPLE_APP_SPECIFIC_PASSWORD  APPLE_TEAM_ID
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          FLAGS="--${{ matrix.arch }} --publish never"
          if [ -z "$CSC_LINK" ]; then
            echo "No Apple cert → building UNSIGNED (add MAC_CSC_LINK to sign)."
            FLAGS="$FLAGS --config.mac.identity=null"
          else
            echo "Apple cert present → signing + notarizing."
          fi
          npx electron-builder --mac dmg zip $FLAGS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: darknode-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

      - name: Publish the .dmg / .zip to the downloads release (darknode-app)
        # Uploads to this repo's own "latest" release, which the web download
        # page (getapp.js) reads from. Uses the built-in token (same-repo write).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::No token — .dmg is on this run's artifacts only."
            exit 0
          fi
          gh release upload latest dist/*.dmg dist/*.zip --repo Darknode-Official/darknode-app --clobber
