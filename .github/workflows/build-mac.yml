name: Build macOS app

# Builds the Sentinel desktop app for macOS (.dmg + .zip, Apple Silicon + Intel) on a
# real macOS runner — the one artifact that can't be cross-built from Linux. Runs on a
# published release (auto-attaches the .dmg) or on demand.
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Build macOS (.dmg + .zip, Intel + Apple Silicon)
        # Signing + notarization are OPTIONAL — the build works unsigned. To ship a
        # SIGNED + notarized .dmg, add these repo secrets (Settings → Secrets → Actions):
        #   MAC_CSC_LINK               base64 of your Apple Developer ID .p12
        #   MAC_CSC_KEY_PASSWORD       the .p12 password
        #   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID   (for notarization)
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac

      - name: Upload build artifacts (always available from this run)
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

      - name: Attach the .dmg / .zip to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
